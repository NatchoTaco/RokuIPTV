[project]
name = "streamforge-api"
version = "0.1.0"
description = "StreamForge FastAPI backend"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.13.2",
  "argon2-cffi>=23.1.0",
  "email-validator>=2.2.0",
  "fastapi[standard]>=0.115.0",
  "itsdangerous>=2.2.0",
  "psycopg[binary]>=3.2.1",
  "pydantic-settings>=2.4.0",
  "redis>=5.0.8",
  "sqlalchemy>=2.0.32",
  "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "mypy>=1.11.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=72.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["streamforge_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = false
plugins = []
ignore_missing_imports = true
